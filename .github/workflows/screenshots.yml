name: SproutPlay Screenshots

# Real phone screenshots for the Play Store listing, captured on an emulator.
# Manual dispatch only. PNGs are committed straight into store-screenshots/
# so they can be fetched reliably (no artifact downloads).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "9.3.1"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -skin 1080x1920
          disable-animations: true
          script: bash scripts/capture-screenshots.sh

      - name: Normalize screenshots to 1080x1920
        run: |
          python3 -m pip install -q pillow
          python3 scripts/normalize.py shots/*.png
          python3 -c "from PIL import Image; import glob; [print(p, Image.open(p).size) for p in sorted(glob.glob('shots/*.png'))]"

      - name: Commit screenshots to the repo
        run: |
          git config user.name "Muse"
          git config user.email "muse@zaviyanllc.com"
          mkdir -p store-screenshots
          cp shots/*.png store-screenshots/
          git add store-screenshots
          git commit -m "Play listing: real emulator screenshots (1080x1920)" || echo "nothing to commit"
          git push origin main
