name: Build SproutPlay

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "9.3.1"
          # Clean-cache run (KSP init failure fix): cache-key-prefix is NOT a
          # valid setup-gradle input (annotation: "Unexpected input(s)"), so
          # disable the Gradle cache entirely for this run.
          cache-disabled: true

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sproutplay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    # Release builds only on manual dispatch, so every push stays a cheap debug check.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "9.3.1"
          # Clean-cache run (KSP init failure fix): cache-key-prefix is NOT a
          # valid setup-gradle input (annotation: "Unexpected input(s)"), so
          # disable the Gradle cache entirely for this run.
          cache-disabled: true

      - name: Decode release keystore
        run: echo "${{ secrets.SPROUT_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/sproutplay-upload-key.jks"

      - name: Build signed release AAB + APK
        env:
          SPROUT_KEYSTORE_PATH: ${{ github.workspace }}/sproutplay-upload-key.jks
          SPROUT_STORE_PASSWORD: ${{ secrets.SPROUT_STORE_PASSWORD }}
          SPROUT_KEY_ALIAS: ${{ secrets.SPROUT_KEY_ALIAS }}
          SPROUT_KEY_PASSWORD: ${{ secrets.SPROUT_KEY_PASSWORD }}
        run: gradle bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: sproutplay-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twintrap-v1.2
          name: Twin Trap v1.2
          files: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/debug/app-debug.apk
